[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartspim-cell-classifier"
version = "0.1.0"
description = "SmartSPIM cell classification model benchmarking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    # Data I/O and array handling
    "numpy",
    "dask[distributed]==2024.8.0",
    "zarr==2.13.6",
    "s3fs",
    "aiobotocore==3.3.0",
    "botocore>=1.42.62,<1.42.71",
    "boto3<1.42.71",
    # Scientific computing
    "scikit-learn",
    "pandas",
    "openpyxl",
    # Deep learning
    "tensorflow[and-cuda]",
    "keras",
    # Cell I/O
    "imlib==0.1.3",
    # Config and utilities
    "PyYAML",
    "xmltodict==0.13.0",
    # Visualization
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["smartspim_cell_classifier"]

[tool.hatch.build.targets.sdist]
include = [
    "smartspim_cell_classifier/",
    "pyproject.toml",
    "README.md",
]
