[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartspim-cell-classifier"
version = "0.1.0"
description = "SmartSPIM cell classification model training and inference"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    # Data I/O and array handling
    "numpy",
    "dask[distributed]==2024.8.0",
    "zarr==2.13.6",
    "tifffile==2023.9.26",
    "s3fs==2023.12.1",
    "boto3",
    # Scientific computing
    "scipy",
    "scikit-learn",
    "scikit-image",
    "pandas",
    "openpyxl",
    "astropy",
    "photutils",
    # Deep learning
    "tensorflow[and-cuda]",
    "keras",
    # Cellfinder / BrainGlobe ecosystem
    "cellfinder>=1.0.0",
    "brainglobe-utils",
    "imlib==0.1.3",
    # Config and utilities
    "PyYAML",
    "xmltodict==0.13.0",
    "six",
    "fancylog",
    # GPU / OpenCL (optional runtime, listed here for completeness)
    "pyopencl",
    "biobeam",
    # Visualization
    "matplotlib",
]

[project.optional-dependencies]
# Install PyTorch separately via conda (pytorch -c pytorch -c nvidia)
# or pin a CPU-only wheel for CI:
torch-cpu = [
    "torch",
    "torchvision",
]

[project.scripts]
smartspim-train-yml = "smartspim_cell_classifier.train.train_yml:cli"

[tool.hatch.build.targets.wheel]
packages = ["smartspim_cell_classifier"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "configs/",
    "pyproject.toml",
    "README.md",
]
