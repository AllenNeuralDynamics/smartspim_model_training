# ============================================================
# SmartSPIM Cell Classifier — Benchmark Configuration
#
# Copy this file, fill in the REQUIRED fields, then run:
#   from smartspim_cell_classifier.pipeline import SmartSPIMPipeline
#   pipeline = SmartSPIMPipeline.from_config("your_config.yaml")
#   pipeline.run()
# ============================================================

# ---- Stages to run -----------------------------------------
benchmark: true
quantify: false

# ---- Required paths ----------------------------------------

# Where to write all outputs (CSVs, XMLs, plots)
save_path: null  # REQUIRED  e.g. /results

# Path to the local .keras model to benchmark
trained_model_path: trained_models/model_01112026.keras

# Path to benchmark config YAML that defines zarr locations,
# channels, and regions per condition
benchmark_config_path: null  # REQUIRED  e.g. benchmark_configs/benchmark_configs.yml

# S3 bucket where detected cell XMLs are stored
bucket_name: aind-open-data

# ---- Classification parameters -----------------------------
classification_params:
  level: "1"        # zarr resolution level to classify at
  pad: 26           # voxel padding added around each cell crop
  batch_size: 32    # inference batch size
  percentile_normalization: true
  percentile_range: [1, 99]

# ---- Quantification (used if quantify: true) ---------------
benchmark_params:
  benchmark_json_path: null  # REQUIRED  e.g. /data/benchmark_jsons/
  layer_name: cells
